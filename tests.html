<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testlar</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
    .ok { color: #1b7f3b; } .xato { color: #c62828; font-weight: 600; }
    #jami { font-size: 20px; font-weight: 700; margin: 12px 0; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>Testlar</h1>
  <div id="jami">Ishlayapti…</div>
  <ul id="natija"></ul>
  <script src="js/calc.js?v=0.4.0"></script>
  <script src="js/data.js?v=0.4.0"></script>
  <script>
    (function () {
      var testlar = [];
      function test(nom, fn) { testlar.push({ nom: nom, fn: fn }); }
      function teng(haqiqiy, kutilgan) {
        if (haqiqiy !== kutilgan) throw new Error('kutilgan: ' + JSON.stringify(kutilgan) + ', chiqdi: ' + JSON.stringify(haqiqiy));
      }

      // --- Calc: summa va sana ---
      test('1250000 -> "1 250 000 so\'m"', function () { teng(Calc.sumFormat(1250000), '1 250 000 so\'m'); });
      test('0 -> "0 so\'m"', function () { teng(Calc.sumFormat(0), '0 so\'m'); });
      test('999 -> "999 so\'m" (ajratuvchisiz)', function () { teng(Calc.sumFormat(999), '999 so\'m'); });
      test('1000 -> "1 000 so\'m"', function () { teng(Calc.sumFormat(1000), '1 000 so\'m'); });
      test('manfiy summa', function () { teng(Calc.sumFormat(-4500), '−4 500 so\'m'); });
      test('sana "2026-10-03" -> "03.10.2026"', function () { teng(Calc.sanaKorsat('2026-10-03'), '03.10.2026'); });
      test('bugun() YYYY-MM-DD ko\'rinishida', function () { teng(Calc.bugun(new Date(2026, 0, 5)), '2026-01-05'); });

      // --- Calc: summani kiritish va tekshirish ---
      test('raqamFormat: "1250000" -> "1 250 000"', function () { teng(Calc.raqamFormat('1250000'), '1 250 000'); });
      test('raqamFormat: harflar tashlanadi, bo\'sh joylar qayta quriladi', function () { teng(Calc.raqamFormat('1 2a50 000'), '1 250 000'); });
      test('raqamFormat: boshidagi minus saqlanadi', function () { teng(Calc.raqamFormat('-5000'), '-5 000'); });
      test('summaTekshir: "1 250 000" -> 1250000', function () { teng(Calc.summaTekshir('1 250 000').summa, 1250000); });
      test('summaTekshir: bo\'sh -> xato', function () { teng(!!Calc.summaTekshir('').xato, true); });
      test('summaTekshir: faqat bo\'sh joy -> xato', function () { teng(!!Calc.summaTekshir('   ').xato, true); });
      test('summaTekshir: nol -> xato', function () { teng(!!Calc.summaTekshir('0').xato, true); });
      test('summaTekshir: "000" -> xato', function () { teng(!!Calc.summaTekshir('000').xato, true); });
      test('summaTekshir: manfiy -> xato', function () { teng(!!Calc.summaTekshir('-5 000').xato, true); });
      test('summaTekshir: harf -> xato', function () { teng(!!Calc.summaTekshir('12a').xato, true); });
      test('summaTekshir: juda katta -> xato', function () { teng(!!Calc.summaTekshir('1' + '0000000000000000').xato, true); });

      // --- Calc: hisob qoldig'i va balans ---
      var H1 = { id: 'h1', boshlangich_qoldiq: 100000 }, H2 = { id: 'h2', boshlangich_qoldiq: 0 };
      var Y = [
        { id: 'a', tur: 'daromad', summa: 5000000, sana: '2026-10-01', yaratilgan: '2026-10-01T08:00:00Z', hisob_id: 'h1' },
        { id: 'b', tur: 'xarajat', summa: 300000, sana: '2026-10-02', yaratilgan: '2026-10-02T08:00:00Z', hisob_id: 'h1' },
        { id: 'c', tur: 'xarajat', summa: 50000, sana: '2026-10-02', yaratilgan: '2026-10-02T09:00:00Z', hisob_id: 'h1' },
        { id: 'd', tur: 'xarajat', summa: 150000, sana: '2026-10-03', yaratilgan: '2026-10-03T08:00:00Z', hisob_id: 'h1' },
        { id: 'e', tur: 'daromad', summa: 70000, sana: '2026-10-03', yaratilgan: '2026-10-03T09:00:00Z', hisob_id: 'h2' }
      ];
      test('hisobQoldigi: boshlang\'ich + daromad - xarajat', function () { teng(Calc.hisobQoldigi(H1, Y), 100000 + 5000000 - 300000 - 50000 - 150000); });
      test('hisobQoldigi: boshqa hisob yozuvlari kirmaydi', function () { teng(Calc.hisobQoldigi(H2, Y), 70000); });
      test('hisobQoldigi: yozuvsiz hisob = boshlang\'ich qoldiq', function () { teng(Calc.hisobQoldigi(H1, []), 100000); });
      test('hisobQoldigi: manfiy bo\'lishi mumkin', function () { teng(Calc.hisobQoldigi(H2, [{ hisob_id: 'h2', tur: 'xarajat', summa: 5 }]), -5); });
      test('umumiyBalans: hisoblar yig\'indisi', function () { teng(Calc.umumiyBalans([H1, H2], Y), 4600000 + 70000); });

      // --- Calc: yozuvlar ro'yxati ---
      test('kunlarBoyicha: eng yangi kun tepada', function () {
        var g = Calc.kunlarBoyicha(Y);
        teng(g.map(function (x) { return x.sana; }).join(), '2026-10-03,2026-10-02,2026-10-01');
      });
      test('kunlarBoyicha: kun xarajati jami (daromad kirmaydi)', function () {
        var g = Calc.kunlarBoyicha(Y);
        teng(g[0].xarajat, 150000); teng(g[1].xarajat, 350000); teng(g[2].xarajat, 0);
      });
      test('kunlarBoyicha: bir kunda oxirgi yaratilgani birinchi', function () {
        teng(Calc.kunlarBoyicha(Y)[1].yozuvlar.map(function (x) { return x.id; }).join(), 'c,b');
      });
      test('kunlarBoyicha: kelajak sanali yozuv eng tepada', function () {
        var g = Calc.kunlarBoyicha(Y.concat([{ id: 'f', tur: 'xarajat', summa: 1, sana: '2027-01-01', yaratilgan: '2026-10-03T10:00:00Z', hisob_id: 'h1' }]));
        teng(g[0].sana, '2027-01-01');
      });
      test('oxirgiYozuvlar: faqat n ta, yangisi birinchi', function () {
        teng(Calc.oxirgiYozuvlar(Y, 2).map(function (x) { return x.id; }).join(), 'e,d');
      });
      test('oxirgiYozuvlar: asl massivni o\'zgartirmaydi', function () {
        Calc.oxirgiYozuvlar(Y, 2); teng(Y[0].id, 'a');
      });
      test('oxirgiHisobId: oxirgi yozuvdagi hisob', function () { teng(Calc.oxirgiHisobId(Y), 'h2'); });
      test('oxirgiHisobId: yozuv yo\'q -> undefined', function () { teng(Calc.oxirgiHisobId([]), undefined); });

      // --- Calc: o'tkazma, hisoblar ---
      var K = { id: 'k', boshlangich_qoldiq: 0 };
      var N = { id: 'n', boshlangich_qoldiq: 0 };
      var OT = [
        { tur: 'daromad', summa: 5000000, hisob_id: 'n' },
        { tur: 'xarajat', summa: 500000, hisob_id: 'n' },
        { tur: 'otkazma', summa: 1000000, hisob_id: 'n', qabul_hisob_id: 'k' }
      ];
      test('o\'tkazma: chiqqan hisob qoldig\'i kamayadi', function () { teng(Calc.hisobQoldigi(N, OT), 3500000); });
      test('o\'tkazma: kirgan hisob qoldig\'i ko\'payadi', function () { teng(Calc.hisobQoldigi(K, OT), 1000000); });
      test('o\'tkazma: umumiy balansni o\'zgartirmaydi', function () {
        teng(Calc.umumiyBalans([N, K], OT), Calc.umumiyBalans([N, K], OT.slice(0, 2)));
        teng(Calc.umumiyBalans([N, K], OT), 4500000);
      });
      test('o\'tkazma: bir hisobga ikki marta tegmaydi (o\'ziga o\'tkazma holati)', function () {
        teng(Calc.hisobQoldigi(N, [{ tur: 'otkazma', summa: 10, hisob_id: 'n', qabul_hisob_id: 'n' }]), 0);
      });
      test('arxivlangan hisob umumiy balansga kirmaydi', function () {
        teng(Calc.umumiyBalans([N, { id: 'k', boshlangich_qoldiq: 0, arxivlangan: true }], OT), 3500000);
      });
      test('arxivlangan hisob qoldig\'i hisoblanaveradi', function () {
        teng(Calc.hisobQoldigi({ id: 'k', boshlangich_qoldiq: 5, arxivlangan: true }, OT), 1000005);
      });
      test('otkazmaTekshir: bir xil hisob -> xato', function () { teng(!!Calc.otkazmaTekshir('a', 'a'), true); });
      test('otkazmaTekshir: bo\'sh hisob -> xato', function () { teng(!!Calc.otkazmaTekshir('a', ''), true); });
      test('otkazmaTekshir: har xil hisob -> xato yo\'q', function () { teng(Calc.otkazmaTekshir('a', 'b'), null); });
      test('hisobNomTekshir: bo\'sh -> xato, bo\'sh joylar kesiladi', function () {
        teng(!!Calc.hisobNomTekshir('  ').xato, true); teng(Calc.hisobNomTekshir('  Karta ').nom, 'Karta');
      });
      test('qoldiqTekshir: bo\'sh va 0 -> 0 (ruxsat)', function () {
        teng(Calc.qoldiqTekshir('').summa, 0); teng(Calc.qoldiqTekshir('0').summa, 0);
      });
      test('qoldiqTekshir: "2 500 000" -> 2500000', function () { teng(Calc.qoldiqTekshir('2 500 000').summa, 2500000); });
      test('qoldiqTekshir: manfiy va harf -> xato', function () {
        teng(!!Calc.qoldiqTekshir('-1').xato, true); teng(!!Calc.qoldiqTekshir('1a').xato, true);
      });

      // --- Versiya belgisi: brauzer har yangilanishda yangi fayllarni yuklashi uchun ---
      function versiyaMatnidan(html) {
        var m = html.match(/<meta name="versiya" content="([^"]+)"/);
        return m ? m[1] : null;
      }
      test('Versiya: index.html dagi barcha style/js havolalari meta versiyasi bilan bir xil ?v= belgisiga ega', function () {
        return fetch('index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
          var v = versiyaMatnidan(html);
          if (!v) throw new Error('index.html da <meta name="versiya"> yo\'q');
          var havolalar = html.match(/(?:src|href)="(?:style\.css|js\/[^"?]+\.js)[^"]*"/g) || [];
          teng(havolalar.length >= 4, true);   // style.css + calc, data, ui
          havolalar.forEach(function (h) {
            if (h.indexOf('?v=' + v + '"') === -1) throw new Error(h + ' — kutilgan ?v=' + v);
          });
        });
      });
      test('Versiya: tests.html ham index.html bilan bir xil versiyadagi fayllarni yuklaydi', function () {
        return fetch('index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
          var v = versiyaMatnidan(html);
          var srcs = Array.prototype.map.call(document.scripts, function (s) { return s.getAttribute('src'); })
            .filter(function (s) { return s && s.indexOf('js/') === 0; });
          teng(srcs.length >= 2, true);
          srcs.forEach(function (s) { if (s.indexOf('?v=' + v) === -1) throw new Error(s + ' — kutilgan ?v=' + v); });
        });
      });

      // --- Hisobning boshlang'ich qoldig'ini tahrirlash ---
      test('boshlang\'ich qoldiq o\'zgarsa, hisob qoldig\'i va umumiy balans shu farqqa o\'zgaradi', function () {
        var yoz = [{ tur: 'daromad', summa: 1000, hisob_id: 'x' }, { tur: 'xarajat', summa: 300, hisob_id: 'x' }];
        var eski = { id: 'x', boshlangich_qoldiq: 500 }, yangi = { id: 'x', boshlangich_qoldiq: 2500 };
        teng(Calc.hisobQoldigi(eski, yoz), 1200);
        teng(Calc.hisobQoldigi(yangi, yoz), 3200);
        teng(Calc.umumiyBalans([yangi], yoz) - Calc.umumiyBalans([eski], yoz), 2000);
      });
      test('boshlang\'ich qoldiqni 0 ga tushirish mumkin (qoldiqTekshir "0" va bo\'sh)', function () {
        teng(Calc.qoldiqTekshir('0').summa, 0); teng(Calc.qoldiqTekshir('').summa, 0);
      });
      test('boshlang\'ich qoldiqni tahrirlash: raqamFormat -> qoldiqTekshir aylanishi o\'zgarmaydi', function () {
        teng(Calc.qoldiqTekshir(Calc.raqamFormat(String(2500000))).summa, 2500000);
      });

      // --- Kategoriya nomi ---
      test('kategoriyaNomTekshir: bo\'sh -> xato, bo\'sh joylar kesiladi', function () {
        teng(!!Calc.kategoriyaNomTekshir('   ').xato, true);
        teng(Calc.kategoriyaNomTekshir('  Bozor ').nom, 'Bozor');
      });

      // --- Filtr va qidiruv ---
      var F = [
        { id: '1', tur: 'daromad', summa: 5000000, sana: '2026-10-01', hisob_id: 'n', kategoriya_id: 'maosh', izoh: 'Oylik' },
        { id: '2', tur: 'xarajat', summa: 300000, sana: '2026-10-02', hisob_id: 'n', kategoriya_id: 'oziq', izoh: 'Bozor: Go\'sht' },
        { id: '3', tur: 'xarajat', summa: 50000, sana: '2026-10-02', hisob_id: 'k', kategoriya_id: 'trans', izoh: '' },
        { id: '4', tur: 'xarajat', summa: 150000, sana: '2026-10-03', hisob_id: 'k', kategoriya_id: 'oziq', izoh: 'bozor' },
        { id: '5', tur: 'otkazma', summa: 1000000, sana: '2026-10-03', hisob_id: 'n', qabul_hisob_id: 'k', kategoriya_id: null, izoh: '' }
      ];
      function idlar(f) { return Calc.yozuvlarniSuz(F, f).map(function (y) { return y.id; }).join(); }
      test('filtr: bo\'sh filtr hamma yozuvni qaytaradi', function () { teng(idlar({}), '1,2,3,4,5'); teng(idlar(), '1,2,3,4,5'); });
      test('filtr: tur', function () { teng(idlar({ tur: 'xarajat' }), '2,3,4'); teng(idlar({ tur: 'otkazma' }), '5'); });
      test('filtr: hisob (o\'tkazmaning qabul hisobi ham kiradi)', function () {
        teng(idlar({ hisob: 'k' }), '3,4,5'); teng(idlar({ hisob: 'n' }), '1,2,5');
      });
      test('filtr: kategoriya', function () { teng(idlar({ kategoriya: 'oziq' }), '2,4'); });
      test('filtr: sana oralig\'i chegaralari bilan', function () {
        teng(idlar({ dan: '2026-10-02', gacha: '2026-10-02' }), '2,3');
        teng(idlar({ dan: '2026-10-03' }), '4,5'); teng(idlar({ gacha: '2026-10-01' }), '1');
      });
      test('filtr: dan > gacha -> hech narsa', function () { teng(idlar({ dan: '2026-10-03', gacha: '2026-10-01' }), ''); });
      test('filtr: izoh bo\'yicha qidiruv harf kattaligiga qaramaydi', function () {
        teng(idlar({ qidiruv: 'BOZOR' }), '2,4'); teng(idlar({ qidiruv: 'go\'sht' }), '2');
      });
      test('filtr: qidiruvdagi bo\'sh joylar kesiladi, izohsiz yozuv topilmaydi', function () {
        teng(idlar({ qidiruv: '  oylik ' }), '1'); teng(idlar({ qidiruv: 'x' }), '');
      });
      test('filtr: shartlar birgalikda ishlaydi', function () {
        teng(idlar({ tur: 'xarajat', hisob: 'k', kategoriya: 'oziq', qidiruv: 'bozor' }), '4');
      });
      test('filtr: asl massiv o\'zgarmaydi', function () { Calc.yozuvlarniSuz(F, { tur: 'daromad' }); teng(F.length, 5); });
      test('filtrFaolmi: qidiruvdan tashqari shartlar', function () {
        teng(Calc.filtrFaolmi({ qidiruv: 'a' }), false); teng(Calc.filtrFaolmi({ dan: '2026-01-01' }), true);
        teng(Calc.filtrFaolmi(bosh()), false);
        function bosh() { return { tur: '', hisob: '', kategoriya: '', dan: '', gacha: '', qidiruv: '' }; }
      });
      test('filtr natijasida kun sarlavhasidagi xarajat faqat ko\'rsatilgan yozuvlardan', function () {
        var g = Calc.kunlarBoyicha(Calc.yozuvlarniSuz(F, { kategoriya: 'oziq' }));
        teng(g.map(function (x) { return x.sana + ':' + x.xarajat; }).join(), '2026-10-03:150000,2026-10-02:300000');
      });

      // --- Data: boshlang'ich ma'lumot (alohida sinov bazasida) ---
      var SINOV_BAZA = 'moliya-sinov';
      test('Data: "Naqd pul" hisobi va tayyor kategoriyalar bir marta yoziladi', function () {
        return Data.boshlash(SINOV_BAZA).then(function () {
          return Promise.all([Data.hammasi('hisoblar'), Data.hammasi('kategoriyalar'), Data.olish('sozlamalar', 'asosiy')]);
        }).then(function (r) {
          teng(r[0].length, 1);
          teng(r[0][0].nom, 'Naqd pul');
          teng(r[0][0].boshlangich_qoldiq, 0);
          teng(r[1].filter(function (k) { return k.tur === 'xarajat'; }).length, 11);
          teng(r[1].filter(function (k) { return k.tur === 'daromad'; }).length, 4);
          teng(r[2].sxema_versiyasi, 1);
          // qayta ochilganda takrorlanmasligi kerak
          Data.yopish();
          return Data.boshlash(SINOV_BAZA);
        }).then(function () {
          return Data.hammasi('hisoblar');
        }).then(function (h) { teng(h.length, 1); });
      });
      test('Data: hisobning boshlang\'ich qoldig\'i o\'zgartirilib saqlanadi', function () {
        var id = Data.yangiId();
        return Data.saqlash('hisoblar', { id: id, yaratilgan: 'x', nom: 'Karta', tur: 'karta', boshlangich_qoldiq: 1000, arxivlangan: false })
          .then(function () { return Data.olish('hisoblar', id); })
          .then(function (h) { h.boshlangich_qoldiq = 2500000; return Data.saqlash('hisoblar', h); })
          .then(function () { return Data.olish('hisoblar', id); })
          .then(function (h) { teng(h.boshlangich_qoldiq, 2500000); teng(h.nom, 'Karta'); return Data.ochirish('hisoblar', id); });
      });
      test('Data: kategoriya nomi o\'zgarsa, yozuv o\'sha id bo\'yicha yangi nomni ko\'radi', function () {
        var kid = Data.yangiId(), yid = Data.yangiId();
        return Data.saqlash('kategoriyalar', { id: kid, yaratilgan: 'x', nom: 'Eski', tur: 'xarajat', rang: '#e57373', arxivlangan: false })
          .then(function () { return Data.saqlash('yozuvlar', { id: yid, tur: 'xarajat', summa: 1, kategoriya_id: kid }); })
          .then(function () { return Data.olish('kategoriyalar', kid); })
          .then(function (k) { k.nom = 'Yangi'; return Data.saqlash('kategoriyalar', k); })
          .then(function () { return Promise.all([Data.olish('yozuvlar', yid), Data.hammasi('kategoriyalar')]); })
          .then(function (r) {
            var k = r[1].filter(function (x) { return x.id === r[0].kategoriya_id; })[0];
            teng(k.nom, 'Yangi');
            return Data.ochirish('yozuvlar', yid).then(function () { return Data.ochirish('kategoriyalar', kid); });
          });
      });
      test('Data: yozuv saqlanadi, o\'qiladi va o\'chiriladi', function () {
        var id = Data.yangiId();
        return Data.saqlash('yozuvlar', { id: id, tur: 'xarajat', summa: 1000 }).then(function () {
          return Data.olish('yozuvlar', id);
        }).then(function (y) {
          teng(y.summa, 1000);
          return Data.ochirish('yozuvlar', id);
        }).then(function () { return Data.olish('yozuvlar', id); })
          .then(function (y) { teng(y, undefined); });
      });
      test('Data: yangiId() noyob', function () { if (Data.yangiId() === Data.yangiId()) throw new Error('bir xil id'); });

      // Sinov bazasini oxirida o'chiramiz, asosiy ma'lumotga tegmaymiz
      function tozalash() {
        Data.yopish();
        return new Promise(function (res) {
          var s = indexedDB.deleteDatabase(SINOV_BAZA);
          s.onsuccess = s.onerror = s.onblocked = function () { res(); };
        });
      }

      var ul = document.getElementById('natija');
      var otdi = 0;
      function qosh(nom, xato) {
        var li = document.createElement('li');
        li.className = xato ? 'xato' : 'ok';
        li.textContent = (xato ? '✗ ' : '✓ ') + nom + (xato ? ' — ' + xato.message : '');
        ul.appendChild(li);
      }
      testlar.reduce(function (zanjir, t) {
        return zanjir.then(function () {
          return Promise.resolve().then(t.fn).then(function () { otdi++; qosh(t.nom); }, function (e) { qosh(t.nom, e); });
        });
      }, Promise.resolve()).then(tozalash).then(function () {
        var j = document.getElementById('jami');
        var hammasi = otdi === testlar.length;
        j.className = hammasi ? 'ok' : 'xato';
        j.textContent = hammasi ? 'Hammasi o\'tdi: ' + otdi + ' / ' + testlar.length
                                : 'Xato bor: ' + otdi + ' / ' + testlar.length + ' o\'tdi';
      });
    })();
  </script>
</body>
</html>
